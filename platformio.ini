; platformio.ini - the ESP32-S3 build of the same firmware/ the emulator runs.
;   pio run -e esp32s3            build (prints flash / RAM use)
;   pio run -e esp32s3 -t upload  flash over USB
; Pins, buses and parts come from firmware/board/board_profile.h. See docs/BRINGUP.md before the first upload.
[platformio]
default_envs = esp32s3
src_dir = firmware

[env:esp32s3]
; espressif32 6.9.0 = Arduino core 2.0.17 (ESP-IDF 4.4): the LEDC, RMT and sleep calls below use that API
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; N16R8: 16 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I firmware
  -DBOARD_HAS_PSRAM
  -DCONFIG_BT_NIMBLE_MAX_BONDS=4
build_src_filter = +<*> -<platform/host/>
lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
  adafruit/RTClib @ ^2.1.1
  adafruit/Adafruit PN532 @ ^1.3.0
  h2zero/NimBLE-Arduino @ ~1.4.1  ; the 1.4 API (2.x renamed the callbacks)
monitor_speed = 115200
